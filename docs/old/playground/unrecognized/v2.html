<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unfound Tags Diagnostic • @keshavsoft/json-to-tag</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
    }

    .table-diagnostic th {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: #f8fafc;
      color: #475569;
      font-weight: 700;
      padding: 11px 14px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
      vertical-align: middle;
    }

    .table-diagnostic td {
      vertical-align: middle;
      font-size: 0.82rem;
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
    }

    .table-diagnostic tbody tr:hover td {
      background-color: #fafbfc;
    }

    .tag-badge {
      background-color: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 4px;
      padding: 3px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
      font-weight: 600;
      display: inline-block;
    }

    .count-circle {
      background-color: #dc2626;
      color: #ffffff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .pill-yes-yellow {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .pill-yes-blue {
      background-color: #e0f2fe;
      color: #0284c7;
      border: 1px solid #bae6fd;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .text-no {
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 400;
    }

    .pill-attr {
      background-color: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      display: inline-block;
    }

    .pill-issue {
      background-color: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .action-text {
      color: #881337;
      font-size: 0.82rem;
    }
  </style>
</head>

<body class="p-3 p-md-4">
  <div class="container-fluid" style="max-width: 1040px;">

    <!-- Top Navigation / Header -->
    <div class="mb-3 pb-2 border-bottom">
      <h1 class="h4 fw-bold mb-1 text-dark d-flex align-items-center gap-2">
        <i class="bi bi-shield-exclamation text-danger"></i> Unfound Tags Diagnostic
        <span class="badge bg-danger-subtle text-danger border border-danger-subtle fs-6 fw-normal">Diagnostic
          Mode</span>
      </h1>
      <p class="text-muted small mb-0">Upload a JSON file to inspect unfound tags missing from <code>tags.json</code>.
      </p>
    </div>

    <!-- Minimal Controls Bar -->
    <div class="d-flex align-items-center gap-2 mb-4 p-2 bg-white rounded border shadow-sm flex-wrap">
      <label for="jsonFileInput" class="form-label mb-0 fw-semibold small text-secondary">
        <i class="bi bi-file-earmark-code text-primary me-1"></i>Select JSON:
      </label>
      <input type="file" id="jsonFileInput" class="form-control form-control-sm" accept=".json,application/json"
        style="max-width: 280px;" />
    </div>

    <!-- Output Section: Only UNFOUND TAGS DIAGNOSTIC BREAKDOWN Card -->
    <div class="card shadow-sm border mb-4" id="outputCard" style="display: none;">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-list-task" style="color: #f87171; font-size: 1.15rem;"></i>
          <span class="fw-bold text-secondary text-uppercase" style="letter-spacing: 0.05em; font-size: 0.85rem;">
            UNFOUND TAGS DIAGNOSTIC BREAKDOWN
          </span>
        </div>
        <span class="small text-muted" id="unfoundSummaryCount">Showing 0 unique unfound tag(s)</span>
      </div>

      <div class="table-responsive">
        <table class="table table-diagnostic mb-0">
          <thead>
            <tr>
              <th style="width: 140px;">UNFOUND TAG</th>
              <th style="width: 80px;" class="text-center">COUNT</th>
              <th style="width: 110px;" class="text-center">CHILDREN?</th>
              <th style="width: 90px;" class="text-center">TEXT?</th>
              <th style="width: 140px;" class="text-center">ATTRIBUTES<br>ATTACHED</th>
              <th style="width: 180px;" class="text-center">DIAGNOSTIC ISSUE</th>
              <th>RECOMMENDED ACTION</th>
            </tr>
          </thead>
          <tbody id="unfoundTbody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module">
    const fileInput = document.getElementById("jsonFileInput");
    const outputCard = document.getElementById("outputCard");
    const unfoundTbody = document.getElementById("unfoundTbody");
    const unfoundSummaryCount = document.getElementById("unfoundSummaryCount");

    let cachedCatalogKeys = null;

    const fetchCatalogKeys = async () => {
      if (cachedCatalogKeys) return cachedCatalogKeys;

      try {
        const res = await fetch("../tags/tags.json");
        if (res.ok) {
          const data = await res.json();
          const keys = Object.keys(data).filter(k => k !== "$schema").map(k => k.toLowerCase());
          cachedCatalogKeys = new Set(keys);
          return cachedCatalogKeys;
        }
      } catch (e) {
        // Fallback to online
      }

      try {
        const res = await fetch("https://keshavsoft.github.io/json-to-tag/tags/tags.json");
        if (res.ok) {
          const data = await res.json();
          const keys = Object.keys(data).filter(k => k !== "$schema").map(k => k.toLowerCase());
          cachedCatalogKeys = new Set(keys);
          return cachedCatalogKeys;
        }
      } catch (e) {
        console.warn("Could not fetch online tags.json, using fallback", e);
      }

      // Offline baseline tags from catalog
      cachedCatalogKeys = new Set([
        "div", "span", "p", "a", "button", "input", "checkbox", "label",
        "select", "option", "optgroup", "textarea", "form",
        "h1", "h2", "h3", "h4", "h6",
        "table", "thead", "tbody", "tfoot", "tr", "th", "td", "colgroup", "col",
        "ul", "ol", "li", "img", "hr", "br", "datalist"
      ]);
      return cachedCatalogKeys;
    };

    const traverseSpec = ({ inNode, inCallback }) => {
      const localNode = inNode;
      const localCallback = inCallback;

      if (!localNode) return;
      if (Array.isArray(localNode)) {
        localNode.forEach(item => traverseSpec({ inNode: item, inCallback: localCallback }));
        return;
      }
      if (typeof localNode !== "object") return;

      localCallback({ inNode: localNode });

      if (Array.isArray(localNode.children)) {
        localNode.children.forEach(child => traverseSpec({ inNode: child, inCallback: localCallback }));
      }
    };

    const analyzeUnfoundTags = ({ inSpec, inCatalogKeys }) => {
      const localSpec = inSpec;
      const catalogKeys = inCatalogKeys ?? new Set();

      const unfoundMap = new Map();

      traverseSpec({
        inNode: localSpec,
        inCallback: ({ inNode }) => {
          const rawTag = inNode.tagName;
          if (typeof rawTag !== "string" || !rawTag.trim()) return;

          const tag = rawTag.trim().toLowerCase();

          // Skip if recognized in tags.json catalog
          if (catalogKeys.has(tag)) return;

          if (!unfoundMap.has(tag)) {
            unfoundMap.set(tag, {
              tag,
              count: 0,
              childrenInstances: 0,
              textInstances: 0,
              attributesAttached: new Set()
            });
          }

          const item = unfoundMap.get(tag);
          item.count++;

          // Check if children exist
          if (Array.isArray(inNode.children) && inNode.children.length > 0) {
            item.childrenInstances++;
          }

          // Check text content
          const hasText = (typeof inNode.textContent === "string" && inNode.textContent.trim().length > 0) ||
            (typeof inNode.innerText === "string" && inNode.innerText.trim().length > 0);
          if (hasText) {
            item.textInstances++;
          }

          // Check attributes used
          if (inNode.classList && String(inNode.classList).trim()) {
            item.attributesAttached.add("class");
          }
          if (inNode.className && String(inNode.className).trim()) {
            item.attributesAttached.add("class");
          }
          if (inNode.id && String(inNode.id).trim()) {
            item.attributesAttached.add("id");
          }
          if (inNode.attributes && typeof inNode.attributes === "object") {
            Object.keys(inNode.attributes).forEach(attr => item.attributesAttached.add(attr));
          }
        }
      });

      return Array.from(unfoundMap.values());
    };

    const renderUnfoundTable = (unfoundList) => {
      unfoundSummaryCount.textContent = `Showing ${unfoundList.length} unique unfound tag(s)`;

      if (unfoundList.length === 0) {
        unfoundTbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-4 text-success fw-medium">
              <i class="bi bi-check-circle-fill me-2 fs-5 align-middle"></i>
              All tags in this specification are recognized in tags.json. Zero unfound tags detected.
            </td>
          </tr>
        `;
        return;
      }

      unfoundTbody.innerHTML = unfoundList.map(item => {
        const childrenHtml = item.childrenInstances > 0
          ? `<span class="pill-yes-yellow">Yes (${item.childrenInstances})</span>`
          : `<span class="text-no">No</span>`;

        const textHtml = item.textInstances > 0
          ? `<span class="pill-yes-blue">Yes</span>`
          : `<span class="text-no">No</span>`;

        const attrsArr = Array.from(item.attributesAttached);
        const attrsHtml = attrsArr.length > 0
          ? attrsArr.map(attr => `<span class="pill-attr me-1 mb-1">${attr}</span>`).join("")
          : `<span class="text-muted small">None</span>`;

        return `
          <tr>
            <td>
              <span class="tag-badge">&lt;${item.tag}&gt;</span>
            </td>
            <td class="text-center">
              <span class="count-circle">${item.count}</span>
            </td>
            <td class="text-center">
              ${childrenHtml}
            </td>
            <td class="text-center">
              ${textHtml}
            </td>
            <td class="text-center">
              ${attrsHtml}
            </td>
            <td class="text-center">
              <span class="pill-issue"><i class="bi bi-slash-circle me-1"></i>Not in tags.json</span>
            </td>
            <td>
              <span class="action-text">Verify spelling or declare tag in tags.json.</span>
            </td>
          </tr>
        `;
      }).join("");
    };

    const processSpecData = async ({ inSpec, inFileName }) => {
      try {
        sessionStorage.setItem("json_to_tag_active_spec", JSON.stringify(inSpec));
        if (inFileName) {
          sessionStorage.setItem("json_to_tag_active_name", inFileName);
        }

        const catalogKeys = await fetchCatalogKeys();
        const unfound = analyzeUnfoundTags({ inSpec: inSpec, inCatalogKeys: catalogKeys });

        renderUnfoundTable(unfound);
        outputCard.style.display = "block";
      } catch (err) {
        alert("Error analyzing JSON: " + err.message);
        console.error(err);
      }
    };

    const processFile = (file) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          processSpecData({ inSpec: json, inFileName: file.name });
        } catch (err) {
          alert("Invalid JSON file: " + err.message);
        }
      };
      reader.readAsText(file);
    };

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      processFile(file);
    });

    // Support drag and drop of JSON file
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      const file = e.dataTransfer?.files?.[0];
      if (file && file.name.endsWith(".json")) {
        processFile(file);
      }
    });

    // Pre-fetch catalog keys in background so it is ready on upload
    fetchCatalogKeys().catch(() => {});
  </script>
</body>

</html>
