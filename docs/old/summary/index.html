<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload JSON • @keshavsoft/json-to-tag</title>
  <meta name="description" content="Simple JSON Specification Uploader for @keshavsoft/json-to-tag" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
    }
  </style>
</head>

<body class="p-3 p-md-4">
  <div class="container" style="max-width: 960px;">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark px-3 py-2 rounded-3 mb-4 shadow-sm">
      <div class="container-fluid p-0">
        <a class="navbar-brand fw-bold fs-6 d-flex align-items-center gap-2" href="../index.html">
          <i class="bi bi-tag-fill text-primary"></i> json-to-tag
        </a>
        <div class="navbar-nav d-flex flex-row gap-1 flex-wrap">
          <a class="nav-link px-2" href="../index.html">Home</a>
          <a class="nav-link px-2 text-info" href="../tags/index.html">Tags Catalog</a>
          <a class="nav-link active px-2 fw-semibold text-warning" href="./index.html"><i
              class="bi bi-cloud-arrow-up me-1"></i>Upload JSON</a>
          <a class="nav-link px-2 text-warning" href="../playground/index.html"><i
              class="bi bi-play-circle me-1"></i>Playground</a>
        </div>
      </div>
    </nav>

    <!-- Compact File Selector (No heading) -->
    <div class="d-flex align-items-center gap-2 mb-3 p-2 bg-white rounded border shadow-sm flex-wrap">
      <label for="jsonFileInput" class="form-label mb-0 fw-semibold small text-secondary">
        <i class="bi bi-file-earmark-code text-primary me-1"></i>Select JSON:
      </label>
      <input type="file" id="jsonFileInput" class="form-control form-control-sm" accept=".json,application/json" style="max-width: 280px;" />
      <button class="btn btn-outline-primary btn-sm" type="button" id="btnSampleSpec">
        <i class="bi bi-file-earmark-arrow-down me-1"></i> Sample
      </button>
      <span class="badge bg-light text-secondary border small ms-auto" id="activeFileNameBadge">No file loaded</span>
    </div>

    <!-- Rendered Output Section (hidden until loaded) -->
    <div id="outputSection" style="display: none;">
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h2 class="h6 fw-bold mb-0 text-uppercase text-secondary">
            <i class="bi bi-display me-1"></i> Rendered Output
          </h2>
          <a href="../playground/index.html" class="btn btn-outline-primary btn-sm fw-semibold" id="btnOpenPlayground">
            <i class="bi bi-play-circle me-1"></i> Open & Test in Playground
          </a>
        </div>
        <div class="card-body p-4 bg-light" id="previewContainer"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-muted small py-4 border-top">
      <p class="mb-0">
        Powered by <strong>@keshavsoft/json-to-tag</strong> (v3 Engine) •
        <a href="../playground/index.html" class="text-secondary text-decoration-none">Playground</a> •
        <a href="https://github.com/keshavsoft/json-to-tag" class="text-secondary text-decoration-none">GitHub</a>
      </p>
    </footer>

  </div>

  <script type="module">
    import { buildSpecElement } from "https://keshavsoft.github.io/json-to-tag/dist/v3/min.js";

    const fileInput = document.getElementById("jsonFileInput");
    const btnSampleSpec = document.getElementById("btnSampleSpec");
    const outputSection = document.getElementById("outputSection");
    const activeFileNameBadge = document.getElementById("activeFileNameBadge");
    const previewContainer = document.getElementById("previewContainer");

    const SAMPLE_SPEC = {
      tagName: "div",
      classList: "card p-4 shadow-sm bg-white",
      children: [
        { tagName: "h4", classList: "text-primary fw-bold mb-2", textContent: "Sample Form Spec" },
        { tagName: "p", classList: "text-muted small", textContent: "This sample verifies form elements, buttons, and labels." },
        {
          tagName: "div",
          classList: "mb-3",
          children: [
            { tagName: "label", classList: "form-label small fw-semibold", textContent: "User Name" },
            { tagName: "input", classList: "form-control", attributes: { type: "text", placeholder: "Enter name" } }
          ]
        },
        {
          tagName: "div",
          classList: "mb-3",
          children: [
            { tagName: "label", classList: "form-label small fw-semibold", textContent: "Role" },
            {
              tagName: "select",
              classList: "form-select",
              children: [
                { tagName: "option", textContent: "Administrator", attributes: { value: "admin" } },
                { tagName: "option", textContent: "Member", attributes: { value: "member" } }
              ]
            }
          ]
        },
        {
          tagName: "button",
          classList: "btn btn-success btn-sm px-4",
          textContent: "Submit Form",
          attributes: { type: "button" }
        }
      ]
    };

    const renderSpec = ({ inSpec, inFileName }) => {
      const localSpec = inSpec;
      const localFileName = inFileName ?? "Custom Spec";

      try {
        sessionStorage.setItem("json_to_tag_active_spec", JSON.stringify(localSpec));
        sessionStorage.setItem("json_to_tag_active_name", localFileName);
        activeFileNameBadge.textContent = localFileName;

        previewContainer.innerHTML = "";
        const rendered = buildSpecElement({ inSpec: localSpec });
        if (rendered) {
          if (Array.isArray(rendered)) {
            previewContainer.append(...rendered);
          } else {
            previewContainer.appendChild(rendered);
          }
        }

        outputSection.style.display = "block";
      } catch (err) {
        alert("Error rendering specification: " + err.message);
      }
    };

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const json = JSON.parse(event.target.result);
          renderSpec({ inSpec: json, inFileName: file.name });
        } catch (err) {
          alert("Invalid JSON file: " + err.message);
        }
      };
      reader.readAsText(file);
    });

    btnSampleSpec.addEventListener("click", () => {
      renderSpec({ inSpec: SAMPLE_SPEC, inFileName: "Sample Spec" });
    });
  </script>
</body>

</html>
